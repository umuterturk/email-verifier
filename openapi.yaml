openapi: 3.1.0
info:
  title: Email Validator API
  version: 1.0.0
  description: |
    Privacy-first email validation API. Checks syntax, DNS/MX, known disposable domains, and role addresses, and can suggest typos.
    It does not perform SMTP RCPT TO, detect catch-all domains, predict bounces, or prove that a specific mailbox exists.
    VALID means the address is syntactically valid, the domain has usable MX, and it is not a known disposable address. It does not mean an inbox exists.

servers:
  - url: /api

paths:
  /validate:
    get:
      summary: Validate a single email address
      description: |
        Checks syntax, DNS/MX, disposable domains, and role addresses.
        Does not confirm that a specific mailbox exists.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Successful validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      summary: Validate a single email address
      description: |
        Checks syntax, DNS/MX, disposable domains, and role addresses.
        Does not confirm that a specific mailbox exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailValidationRequest'
      responses:
        '200':
          description: Successful validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /validate/batch:
    get:
      summary: Validate multiple email addresses
      description: Validates multiple email addresses in a single request
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              format: email
          style: form
          explode: true
      responses:
        '200':
          description: Successful validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchValidationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      summary: Validate multiple email addresses
      description: Validates multiple email addresses in a single request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchValidationRequest'
      responses:
        '200':
          description: Successful validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchValidationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /typo-suggestions:
    get:
      summary: Get typo suggestions for an email address
      description: Returns suggestions for possible typos in the email address
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypoSuggestionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      summary: Get typo suggestions for an email address
      description: Returns suggestions for possible typos in the email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypoSuggestionRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypoSuggestionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /status:
    get:
      summary: Get API status
      description: Returns the current status of the API
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIStatus'

components:
  schemas:
    ValidationResult:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email address that was validated
        validations:
          type: object
          properties:
            syntax:
              type: boolean
              description: Whether the email has valid syntax
            domain_exists:
              type: boolean
              description: >
                Whether the domain can receive email: usable MX records, or an A/AAAA record
                when MX is absent (RFC 5321 fallback). This is not a website-existence check.
            mx_records:
              type: boolean
              description: >
                Whether the domain has usable MX records. A null MX (RFC 7505) is false.
                mailbox_exists is set from this same check.
            mailbox_exists:
              type: boolean
              description: >
                True when the email provider (the domain's MX) can accept mail.
                The service sets this from the MX check, so it matches mx_records.
                It does not prove that the local-part mailbox or inbox exists, and it is not an SMTP result.
            is_disposable:
              type: boolean
              description: Whether the email is from a disposable provider
            is_role_based:
              type: boolean
              description: Whether the email is a role-based address
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall validation score
        status:
          type: string
          enum:
            - VALID
            - PROBABLY_VALID
            - INVALID
            - MISSING_EMAIL
            - INVALID_FORMAT
            - INVALID_DOMAIN
            - NO_MX_RECORDS
            - DISPOSABLE
          description: >
            Validation status. VALID means the address is syntactically valid, the domain has
            usable MX, and it is not a known disposable address. It does not mean a specific inbox exists.
        aliasOf:
          type: string
          format: email
          description: If the email is an alias, this field contains the canonical form
        typoSuggestion:
          type: string
          description: Suggested correction for the email if a typo is detected

    EmailValidationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The email address to validate

    BatchValidationRequest:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
          description: List of email addresses to validate

    BatchValidationResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
          description: List of validation results

    TypoSuggestionRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The email address to check for typos

    TypoSuggestionResponse:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The original email address
        typoSuggestion:
          type: string
          description: Suggested correction for the email address

    APIStatus:
      type: object
      properties:
        status:
          type: string
          description: Current status of the API
        uptime:
          type: string
          description: Time since the API started
        requests_handled:
          type: integer
          description: Total number of requests handled
        average_response_time_ms:
          type: number
          description: Average response time in milliseconds

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong 